server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Frontend and backend deliberately share one origin. Hub's session cookie
  # is SameSite=Strict, and launching an app is a top-level navigation from
  # the page to /apps/:id/launch - across two origins that cookie would not
  # be sent and every launch would 401. Same origin also means no CORS.
  #
  # These prefixes belong to the backend and are therefore unavailable as SPA
  # routes. Keep the SPA's router away from API endpoints while still letting
  # /admin render the React dashboard.
  location /auth/ {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /apps {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Server-to-server SSO code exchange - a satellite app's backend, not the
  # browser, calls this (X-Hub-Internal-Secret header, never a cookie), but
  # it still lives on the backend like everything else under this origin.
  location /sso/ {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin/dashboard-data {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /admin/api/ {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Satellites fetch Hub's public key from here to verify relay tokens.
  # Cached briefly so a key rotation propagates in minutes, not on restart.
  location /.well-known/jwks.json {
    set $hub_api backend:4001;
    proxy_pass http://$hub_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=300";
  }

  # Runtime config, written by docker-entrypoint.d on every container start.
  # Never cached: it is how one image is pointed at different environments.
  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  # The service worker and the files that start it must never be cached, by the browser or by Cloudflare. A cached
  # copy keeps an old worker alive, and an old worker answers /mtss/ and /daily-checkin/ with the Hub page.
  location = /hub-sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location ~ ^/workbox-[^/]+\.js$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  # The old worker's name. Answering 404 makes browsers that still hold it drop it.
  location = /sw.js {
    add_header Cache-Control "no-store";
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
