name: MWS HUB CI/CD Pipeline

on:
  push:
    branches: ["staging", "master"]
  pull_request:
    branches: ["staging", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-be:
    name: Backend Validation (Bun, Hono)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://hub_ci:hub_ci@127.0.0.1:5432/mws_hub_ci_test
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install BE deps
        run: bun install --frozen-lockfile

      # The catalog, the access policy and the token claims are all typed,
      # so a shape mistake fails the build rather than production.
      - name: Typecheck BE
        run: bun run typecheck

      # Tests are still hermetic and use mocked fetch/env. Prisma validates
      # DATABASE_URL when imported, so CI provides a non-production URL without
      # starting a database service container.
      - name: Test BE
        run: bun test

  test-fe:
    name: Frontend Validation (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FE deps
        run: bun install --frozen-lockfile

      - name: Lint FE
        run: bunx eslint src

      - name: Build FE
        run: bun run build

  sync-permissions-staging:
    name: Send Permission List To Central (Staging)
    needs: [test-be, test-fe]
    if: success() && github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install BE deps
        run: bun install --frozen-lockfile

      # The permission list of this version has to reach Central before the new container replaces the
      # old one. If it cannot (Central down, not deployed with the endpoints yet, or it refuses the
      # list) this job fails, the deploy below does not run, and the version that is running stays.
      - name: Send permissions
        env:
          CENTRAL_API_BASE_URL: ${{ secrets.CENTRAL_API_BASE_URL_STAGING || secrets.CENTRAL_API_BASE_URL }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN_STAGING || secrets.CENTRAL_API_TOKEN }}
        run: |
          if [ -z "$CENTRAL_API_BASE_URL" ] || [ -z "$CENTRAL_API_TOKEN" ]; then
            echo "::error::CENTRAL_API_BASE_URL and CENTRAL_API_TOKEN secrets are not set (Staging)."
            exit 1
          fi
          bun run scripts/sync-permissions.ts sync --retries 5 --wait 20

  deploy-staging:
    name: Trigger Komodo Deploy (Staging)
    needs: [test-be, test-fe, sync-permissions-staging]
    if: success() && github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Komodo webhook (Staging)
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL_STAGING || secrets.KOMODO_STAGING_WEBHOOK_URL || secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET_STAGING || secrets.KOMODO_STAGING_WEBHOOK_SECRET || secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "::error::Staging webhook secrets are not set."
            exit 1
          fi

          payload='{"ref":"refs/heads/staging"}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')"

          HTTP_STATUS=$(curl -s -o /tmp/komodo_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload" \
            "$KOMODO_WEBHOOK_URL")

          echo "Komodo response [HTTP $HTTP_STATUS]:"
          cat /tmp/komodo_resp.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] || exit 1

  sync-permissions-production:
    name: Send Permission List To Central (Production)
    needs: [test-be, test-fe]
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install BE deps
        run: bun install --frozen-lockfile

      # The permission list of this version has to reach Central before the new container replaces the
      # old one. If it cannot (Central down, not deployed with the endpoints yet, or it refuses the
      # list) this job fails, the deploy below does not run, and the version that is running stays.
      - name: Send permissions
        env:
          CENTRAL_API_BASE_URL: ${{ secrets.CENTRAL_API_BASE_URL_PRODUCTION || secrets.CENTRAL_API_BASE_URL }}
          CENTRAL_API_TOKEN: ${{ secrets.CENTRAL_API_TOKEN_PRODUCTION || secrets.CENTRAL_API_TOKEN }}
        run: |
          if [ -z "$CENTRAL_API_BASE_URL" ] || [ -z "$CENTRAL_API_TOKEN" ]; then
            echo "::error::CENTRAL_API_BASE_URL and CENTRAL_API_TOKEN secrets are not set (Production)."
            exit 1
          fi
          bun run scripts/sync-permissions.ts sync --retries 5 --wait 20

  deploy-production:
    name: Trigger Komodo Deploy (Production)
    needs: [test-be, test-fe, sync-permissions-production]
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Komodo webhook (Production)
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL_MAIN || secrets.KOMODO_WEBHOOK_URL_PRODUCTION || secrets.KOMODO_PRODUCTION_WEBHOOK_URL || secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET_MAIN || secrets.KOMODO_WEBHOOK_SECRET_PRODUCTION || secrets.KOMODO_PRODUCTION_WEBHOOK_SECRET || secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "::error::Production webhook secrets are not set."
            exit 1
          fi

          payload='{"ref":"refs/heads/master"}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')"

          HTTP_STATUS=$(curl -s -o /tmp/komodo_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload" \
            "$KOMODO_WEBHOOK_URL")

          echo "Komodo response [HTTP $HTTP_STATUS]:"
          cat /tmp/komodo_resp.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] || exit 1
