name: MWS HUB CI/CD Pipeline

on:
  push:
    branches: ["staging", "master"]
  pull_request:
    branches: ["staging", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-be:
    name: Backend Validation (Bun, Hono)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install BE deps
        run: bun install --frozen-lockfile

      # Hub has no test suite yet. Typecheck is the gate that actually holds
      # here: the catalog, the access policy and the token claims are all
      # typed, so a shape mistake fails the build rather than production.
      - name: Typecheck BE
        run: bun run typecheck

  test-fe:
    name: Frontend Validation (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install FE deps
        run: bun install --frozen-lockfile

      - name: Lint FE
        run: bunx eslint src

      - name: Build FE
        run: bun run build

  deploy-staging:
    name: Trigger Komodo Deploy (Staging)
    needs: [test-be, test-fe]
    if: success() && github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Komodo webhook (Staging)
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL_STAGING || secrets.KOMODO_STAGING_WEBHOOK_URL || secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET_STAGING || secrets.KOMODO_STAGING_WEBHOOK_SECRET || secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "::error::Staging webhook secrets are not set."
            exit 1
          fi

          payload='{"ref":"refs/heads/staging"}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')"

          HTTP_STATUS=$(curl -s -o /tmp/komodo_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload" \
            "$KOMODO_WEBHOOK_URL")

          echo "Komodo response [HTTP $HTTP_STATUS]:"
          cat /tmp/komodo_resp.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] || exit 1

  deploy-production:
    name: Trigger Komodo Deploy (Production)
    needs: [test-be, test-fe]
    if: success() && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Komodo webhook (Production)
        env:
          KOMODO_WEBHOOK_URL: ${{ secrets.KOMODO_WEBHOOK_URL_MAIN || secrets.KOMODO_WEBHOOK_URL_PRODUCTION || secrets.KOMODO_PRODUCTION_WEBHOOK_URL || secrets.KOMODO_WEBHOOK_URL }}
          KOMODO_WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET_MAIN || secrets.KOMODO_WEBHOOK_SECRET_PRODUCTION || secrets.KOMODO_PRODUCTION_WEBHOOK_SECRET || secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$KOMODO_WEBHOOK_URL" ] || [ -z "$KOMODO_WEBHOOK_SECRET" ]; then
            echo "::error::Production webhook secrets are not set."
            exit 1
          fi

          payload='{"ref":"refs/heads/master"}'
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" | sed 's/^.* //')"

          HTTP_STATUS=$(curl -s -o /tmp/komodo_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload" \
            "$KOMODO_WEBHOOK_URL")

          echo "Komodo response [HTTP $HTTP_STATUS]:"
          cat /tmp/komodo_resp.txt
          [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ] || exit 1
