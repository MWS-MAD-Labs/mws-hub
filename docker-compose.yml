# mws-hub STAGING - Komodo stack
# Same deployment concept as mws-daily-checkin and mws-mtss-system: GitHub
# Actions builds and pushes images to GHCR, then triggers the webhook. Komodo
# only pulls and runs - it never builds, which is what keeps a deploy measured
# in seconds instead of a full Vite build on the server.
#
# Production lives in deploy/production.compose.yml.
#
# Only the frontend joins the gateway network. Nginx serves the app and
# proxies /auth, /apps and /.well-known to the backend over the internal
# network, so Hub's SameSite=Strict session cookie stays first-party and
# app launches are same-origin navigations. See KOMODO_SETUP.md.

services:
  backend:
    image: ghcr.io/mws-mad-labs/mws-hub-be:staging
    container_name: mws-hub-be
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4001}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-postmessage}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-millennia21.id}
      CENTRAL_API_BASE_URL: ${CENTRAL_API_BASE_URL}
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hub_session}
      HUB_SSO_PRIVATE_KEY: ${HUB_SSO_PRIVATE_KEY}
      HUB_SSO_KEY_ID: ${HUB_SSO_KEY_ID:-mws-hub-sso-stg}
      HUB_SSO_PUBLIC_KEY: ${HUB_SSO_PUBLIC_KEY}
      DAILY_CHECKIN_API_URL: ${DAILY_CHECKIN_API_URL}
      MTSS_API_URL: ${MTSS_API_URL}
    expose:
      - "4001"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/mws-mad-labs/mws-hub-fe:staging
    container_name: mws-hub-fe
    restart: unless-stopped
    environment:
      # Empty on purpose - same origin, nginx proxies the API next door.
      HUB_API_BASE_URL: ""
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-admin@millennia21.id}
      # Leave empty before a real staging domain exists. The frontend nginx
      # entrypoint will then accept Komodo's temporary host.
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
    depends_on:
      - backend
    networks:
      - internal
      - mws-unified
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified
