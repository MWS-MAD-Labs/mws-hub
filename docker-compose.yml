# mws-hub local/staging compose.
# The frontend is the single browser entry point and proxies /auth, /apps and
# /.well-known to the backend over Docker's internal network.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mws-hub-be
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5175}
    expose:
      - "4001"
    networks:
      - hub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mws-hub-fe
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Empty on purpose - same origin, nginx proxies the API next door.
      HUB_API_BASE_URL: ""
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    networks:
      - hub
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  hub:
    driver: bridge
