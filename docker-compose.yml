
services:
  db:
    image: postgres:16-alpine
    container_name: mws-hub-db
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    volumes:
      - hubdata:/var/lib/postgresql/data
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5431}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-hub} -d $${POSTGRES_DB:-mws-hub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    container_name: mws-hub-be
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false

    environment:
      NODE_ENV: production
      PORT: 4001
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hub_session}
    command: sh -c "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-hub}:$${POSTGRES_PASSWORD:-postgress123Abc}@db:5432/$${POSTGRES_DB:-mws-hub}?schema=public\" && bun run db:migrate && bun run src/index.ts"

    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4001"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4001}:4001"

    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e ''const r = await fetch("http://127.0.0.1:4001/health"); if (!r.ok) process.exit(1)''',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    container_name: mws-hub-fe
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false

    expose:
      - "80"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5178}:80"

    environment:
      HUB_API_BASE_URL: ""

    # Deliberately does NOT depend on backend. Nginx proxies the API through a
    # variable (`set $hub_api backend:4001`) with a resolver, so it resolves the
    # backend per request instead of at startup - an absent backend costs /auth
    # and /apps, nothing else. Waiting on backend here chained the frontend to
    # the database as well (backend waits for db healthy), so a database that
    # could not start took down the static login page with it, and the gateway
    # reported 502 for a route that never touches the API.
    networks:
      internal:
      mws-unified:
        aliases:
          - mws-hub-fe
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- --header="Host: localhost" http://127.0.0.1/health >/dev/null',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified

volumes:
  hubdata:
