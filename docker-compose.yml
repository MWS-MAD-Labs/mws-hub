
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgress123Abc}
      POSTGRES_DB: ${POSTGRES_DB:-mws-hub}
    volumes:
      - hubdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-mws-hub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hub}:${POSTGRES_PASSWORD:-postgress123Abc}@db:5432/${POSTGRES_DB:-mws-hub}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL}
      CENTRAL_API_BASE_URL: ${CENTRAL_API_BASE_URL}
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-hub_session}
      HUB_SSO_PRIVATE_KEY: ${HUB_SSO_PRIVATE_KEY}
      HUB_SSO_KEY_ID: ${HUB_SSO_KEY_ID}
      HUB_SSO_PUBLIC_KEY: ${HUB_SSO_PUBLIC_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4001"

    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e ''const r = await fetch("http://127.0.0.1:4001/health"); if (!r.ok) process.exit(1)''',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-5175}:80"

    environment:
      HUB_API_BASE_URL: ""
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}

    depends_on:
      - backend

    networks:
      - internal
      - mws-unified
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified

volumes:
  hubdata:
