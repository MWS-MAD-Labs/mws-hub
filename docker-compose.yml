# mws-hub staging compose for Komodo.
# The frontend is the single browser entry point and proxies /auth, /apps and
# /.well-known to the backend over Docker's internal network.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mws-hub-be
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      NODE_ENV: production
      PORT: 4001
    expose:
      - "4001"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'const r = await fetch(\"http://127.0.0.1:4001/health\"); if (!r.ok) process.exit(1)'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mws-hub-fe
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      # Empty on purpose - same origin, nginx proxies the API next door.
      HUB_API_BASE_URL: ""
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
    depends_on:
      - backend
    networks:
      - internal
      - mws-unified
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified
