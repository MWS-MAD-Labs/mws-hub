# mws-hub production - Komodo compose
# GitHub Actions triggers the webhook; Komodo builds and deploys from source.
# The production gateway reaches this stack through the external
# mws-unified-prod network as hub-fe-prod.
#
# Only the frontend joins that network: it is the single entry point, and it
# proxies /auth, /apps and /.well-known to the backend over the internal
# network. The backend is never exposed to the gateway directly, which is
# also what keeps Hub's session cookie first-party.

services:
  db:
    image: postgres:16-alpine
    container_name: hub-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mws-hub}
    volumes:
      - hubdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hub} -d ${POSTGRES_DB:-mws-hub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hub-be-prod
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4001"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: hub-fe-prod
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      # Empty on purpose - same-origin, nginx proxies the API next door.
      HUB_API_BASE_URL: ""
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-https://hub.millenniaws.sch.id}
    depends_on:
      - backend
    networks:
      - internal
      - mws-unified-prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified-prod:
    external: true
    name: mws-unified-prod

volumes:
  hubdata:
