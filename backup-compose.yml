# MWS Unified Gateway — Komodo manual compose (self-contained)
# ─────────────────────────────────────────────────────────────────────
# Routes one domain to two products (path-based). No build, no external file
# mounts: the nginx config is embedded via Docker Compose `configs.content`
# (needs Docker Compose v2.23+). The official nginx image is pulled from Docker Hub.
#
# This gateway "owns" the mws-unified network (it creates it). The product
# stacks join it as external. Deploy the gateway FIRST so the network exists.
# ─────────────────────────────────────────────────────────────────────

services:
  gateway:
    image: nginx:1.27-alpine
    container_name: mws-gateway
    restart: unless-stopped
    # Staging cutover publishes the gateway on the legacy staging app port.
    # The old staging monolith stack must be stopped before this stack binds 4177.
    ports:
      - "4177:80"
    configs:
      - source: gateway_nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - mws-unified
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/__gateway_health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  gateway_nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
      }
      server {
          listen 80;
          server_name _;
          resolver 127.0.0.11 valid=10s ipv6=off;
          client_max_body_size 30m;

          location = /__gateway_health {
              return 200 "gateway ok\n";
              add_header Content-Type text/plain;
          }

          # MTSS — FE built with base '/mtss/', forwarded as-is (no strip)
          location /mtss/ {
              set $$mtss_fe mtss-system-fe;
              proxy_pass http://$$mtss_fe:80;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
          }
          location = /mtss { return 308 /mtss/; }

          # Daily Check-in (default)
          location / {
              set $$checkin_fe daily-checkin-fe;
              proxy_pass http://$$checkin_fe:80;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
          }
      }

networks:
  mws-unified:
    name: mws-unified
    driver: bridge
